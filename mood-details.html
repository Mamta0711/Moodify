<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Details | Moodify</title>
  <link rel="stylesheet" href="mood-deatils.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="header-left">
        <img src="moodify-logo.png" alt="Moodify Logo" class="logo" />
      </div>
      <ul>
        <li><a href="project.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>
  
  <div class="mood-header">
    <div class="mood-emoji" id="mood-emoji">😊</div>
    <h1 class="mood-title" id="mood-title">Happy</h1>
    <p class="mood-description" id="mood-description">
      Bright, uplifting tunes to boost your mood and keep you smiling.
    </p>
  </div>

  <div class="search-bar-container">
    <input type="text" id="search-input" placeholder="Search songs or artists..." />
  </div>

  <div class="playlist-container">
    <h2 class="playlist-title">Your Happy Playlist</h2>
    <div id="playlist-content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading your perfect playlist...</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
